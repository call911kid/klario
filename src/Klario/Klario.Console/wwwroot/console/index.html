<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="gateView" class="gate-overlay">
        <canvas id="antigravityCanvas" class="gate-particles"></canvas>
        <div class="gate-box">
            <h1 class="gate-logo">KLARIO</h1>
            <p class="gate-sub">State Your Secret</p>
            <form id="gateForm" class="gate-form" novalidate>
                <div class="field gate-field">
                    <div class="pass-wrapper">
                        <input type="password" id="gateKeyInput" placeholder="Secret" autofocus spellcheck="false">
                        <button type="button" id="toggleGateKey" class="icon-btn" title="Toggle visibility" aria-label="Toggle visibility">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="gateError" class="gate-error" style="display: none;">
                        <span class="gate-error-arrow"></span>
                        <div class="gate-error-body">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <span id="gateErrorText">You had one job!</span>
                        </div>
                    </div>
                </div>
                <label class="gate-remember">
                    <input type="checkbox" id="gateRemember" checked>
                    <span>Remember secret on this browser</span>
                </label>
                <button type="submit" id="btnGateSubmit" class="btn btn-primary btn-block">rm -rf unemployment</button>
            </form>
        </div>
    </div>

    <div id="dashboardApp" class="app" style="display: none;">
        <header class="header">
            <div class="header-left">
                <span class="logo">KLARIO</span>
                <nav class="nav">
                    <button id="navProfiles" class="nav-btn active">Profiles</button>
                    <button id="navBlacklist" class="nav-btn">Blacklisted Companies</button>
                </nav>
            </div>

            <div class="header-right">
                <div class="field-inline">
                    <label for="apiUrl">Server</label>
                    <input type="text" id="apiUrl" value="https://localhost:7220" placeholder="https://localhost:7220" spellcheck="false">
                </div>

                <button type="button" id="btnLock" class="btn-lock" title="Lock console" aria-label="Lock console">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-body">
            <section id="viewProfiles" class="view-section active">
                <aside class="profiles-sidebar">
                    <div class="sidebar-top">
                        <button type="button" id="btnNewProfile" class="btn btn-new" title="Create new profile">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>New Profile</span>
                        </button>
                        <div class="sidebar-search-box">
                            <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="profileSearch" placeholder="Search profiles..." spellcheck="false">
                        </div>
                    </div>

                    <div class="sidebar-count" id="profileCount">0 profiles</div>

                    <nav id="sidebarProfiles" class="sidebar-list">
                        <div class="sidebar-empty">No profiles found.</div>
                    </nav>
                </aside>

                <div class="profile-editor">
                    <div class="editor-content">
                        <div class="editor-header">
                            <h2 id="formHeading">New Profile</h2>
                            <button type="button" id="btnDeleteProfile" class="btn btn-danger" style="display: none;">Delete</button>
                        </div>

                    <form id="profileForm" class="form">
                        <input type="hidden" id="editId" value="">

                        <div class="form-row">
                            <div class="field flex-2">
                                <label for="profileName">Name *</label>
                                <input type="text" id="profileName" placeholder="e.g. Backend .NET" required spellcheck="false">
                            </div>
                            <div class="field flex-3">
                                <label for="profileDesc">Description</label>
                                <input type="text" id="profileDesc" placeholder="Optional notes">
                            </div>
                        </div>

                        <div id="activeRow" class="form-row" style="display: none;">
                            <label class="checkbox-label">
                                <input type="checkbox" id="profileActive" checked>
                                <span>Active</span>
                            </label>
                        </div>

                        <div class="form-row">
                            <div class="field flex-1 tag-field">
                                <label for="titleInput">Target Job Titles *</label>
                                <input type="text" id="titleInput" placeholder="Type title and press Enter..." spellcheck="false">
                                <div id="titleTags" class="tag-chips"></div>
                            </div>

                            <div class="field flex-1 tag-field">
                                <label for="locationInput">Target Locations *</label>
                                <input type="text" id="locationInput" placeholder="Type location and press Enter..." spellcheck="false">
                                <div id="locationTags" class="tag-chips"></div>
                            </div>
                        </div>

                        <div class="form-row multi-select-row">
                            <div class="field flex-1">
                                <label>Workplace</label>
                                <div class="checkbox-group" id="workplaceGroup">
                                    <label class="pill-check"><input type="checkbox" value="Remote" checked><span>Remote</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Hybrid"><span>Hybrid</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Onsite"><span>Onsite</span></label>
                                </div>
                            </div>

                            <div class="field flex-1">
                                <label>Experience Level</label>
                                <div class="checkbox-group" id="experienceGroup">
                                    <label class="pill-check"><input type="checkbox" value="Internship"><span>Internship</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Junior"><span>Junior</span></label>
                                    <label class="pill-check"><input type="checkbox" value="MidLevel" checked><span>MidLevel</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Senior"><span>Senior</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Lead"><span>Lead</span></label>
                                </div>
                            </div>

                            <div class="field flex-1">
                                <label>Job Type</label>
                                <div class="checkbox-group" id="jobTypeGroup">
                                    <label class="pill-check"><input type="checkbox" value="FullTime" checked><span>FullTime</span></label>
                                    <label class="pill-check"><input type="checkbox" value="PartTime"><span>PartTime</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Contract"><span>Contract</span></label>
                                    <label class="pill-check"><input type="checkbox" value="Internship"><span>Internship</span></label>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="field flex-1">
                                <label for="profileInterval">Scrape Interval (Minutes)</label>
                                <input type="number" id="profileInterval" value="15" min="1" required>
                            </div>
                            <div class="field flex-1">
                                <label for="profileMaxAge">Max Age (Minutes)</label>
                                <input type="number" id="profileMaxAge" value="1440" min="1" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="field flex-1">
                                <label for="telegramChatId">Telegram Chat ID *</label>
                                <input type="text" id="telegramChatId" placeholder="-1001234567890" required>
                            </div>
                            <div class="field flex-1">
                                <label for="botToken">Bot Token *</label>
                                <div class="pass-wrapper">
                                    <input type="password" id="botToken" placeholder="123456:ABC-DEF..." required>
                                    <button type="button" id="toggleBotToken" class="icon-btn" title="Toggle visibility" aria-label="Toggle visibility">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="btnSubmitProfile" class="btn btn-primary">Save Profile</button>
                            <button type="button" id="btnResetForm" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                    </div> 
                </div> 
            </section>

            <section id="viewBlacklist" class="view-section" style="display: none;">
                <div class="section-placeholder">
                    <h3>Blacklisted Companies</h3>
                    <p>Company filtering will be configurable here.</p>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
